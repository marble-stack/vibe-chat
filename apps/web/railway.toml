[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_20"]

[build.nixpacksPlan.phases.install]
cmds = ["npm install -g pnpm", "cd ../.. && pnpm install --frozen-lockfile"]

[build.nixpacksPlan.phases.build]
cmds = ["pnpm build"]

[deploy]
startCommand = "npx serve -s dist -l $PORT"
