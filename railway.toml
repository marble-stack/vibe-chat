[build]
builder = "NIXPACKS"
# Install all dependencies and build the server
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @vibe-chat/server build"

[deploy]
# Run migrations then start the server
startCommand = "pnpm --filter @vibe-chat/server db:migrate:prod && node apps/server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
