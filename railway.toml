[build]
builder = "NIXPACKS"
# Build the server (devDependencies must be available for tsc)
buildCommand = "pnpm --filter @vibe-chat/server build"

[deploy]
# Run migrations then start the server
startCommand = "NODE_ENV=production pnpm --filter @vibe-chat/server db:migrate:prod && NODE_ENV=production node apps/server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
